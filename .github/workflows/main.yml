name: Auto Fetch YouTube Fancams

on:
  # 1. 抓取频率：可以设置定时任务（比如每天北京时间早上 8 点自动跑一次）
  schedule:
    - cron: '0 0 * * *' 
  
  # 2. 支持手动在 GitHub 页面点击 "Run workflow" 触发
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Crawler Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_ID: "UCM3jwNRfl5-W8VzgT6DsaEQ"
          MAX_RESULTS: "200"          # 想抓取最近多少条
          TARGET_DATE: "260817"      # 如果你想指定只留特定日期的视频
        run: node scripts/fetch.js
