name: Auto Fetch YouTube Fancams

on:
  # 1. 抓取频率：每天北京时间早上 8 点自动跑一次（UTC 时间 0 点）
  schedule:
    - cron: '0 0 * * *' 
  
  # 2. 支持手动在 GitHub 页面点击 "Run workflow" 触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Crawler Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_ID: "UCM3jwNRfl5-W8VzgT6DsaEQ"
          MAX_RESULTS: "200"          # 抓取最近 200 条
          TARGET_DATE: ""             # 留空则默认抓取最新，不强制限定某一天
        run: node fetch.js            # 确保你的抓取脚本直接放在仓库根目录下，并命名为 fetch.js

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update fancam data"
          file_pattern: "fancams.json"
